[package]
name = "duckdoor"
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
description = "A read-only DuckDB gateway for local SQLite, DuckDB, and Parquet data"
license = "Apache-2.0"
repository = "https://github.com/deadjoe/duckdoor"
keywords = ["duckdb", "sqlite", "parquet", "gateway", "analytics"]
categories = ["database", "command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
axum = { version = "0.8", features = ["json"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
directories = "6.0"
# The middle component encodes the engine version; review engine upgrades separately.
# 1.20000.1 fixes the bundled version used to select official SQLite extensions.
duckdb = { version = "~1.20000.1", features = ["bundled", "parquet"] }
fs2 = "0.4"
glob = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.63", features = ["visitor"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[patch.crates-io]
# Preserve SQL NULL values, including nested values, until duckdb-rs fixes NullArray decoding.
duckdb = { path = "vendor/duckdb" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
