[package]
name = "duckdoor"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "A read-only DuckDB gateway for local SQLite, DuckDB, and Parquet data"
license = "Apache-2.0"
repository = "https://github.com/deadjoe/duckdoor"
keywords = ["duckdb", "sqlite", "parquet", "gateway", "analytics"]
categories = ["database", "command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8", features = ["json"] }
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
directories = "6.0"
duckdb = { version = "1.10505.0", features = ["bundled"] }
fs2 = "0.4"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.62", features = ["visitor"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
