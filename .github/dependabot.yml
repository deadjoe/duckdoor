version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      duckdb:
        patterns: ["duckdb", "libduckdb-sys"]
      rust-dependencies:
        patterns: ["*"]
        exclude-patterns: ["duckdb", "libduckdb-sys"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
