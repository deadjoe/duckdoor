name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify upgrade from DuckDB 1.5.6
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/duckdoor-upgrade-venv"
          "$RUNNER_TEMP/duckdoor-upgrade-venv/bin/python" -m pip install --only-binary=:all: duckdb==1.5.6
          "$RUNNER_TEMP/duckdoor-upgrade-venv/bin/python" scripts/verify_upgrade.py target/release/duckdoor

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
